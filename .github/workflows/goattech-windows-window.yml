name: GoatTech Windows window qualification
# Scratch-only instrumented capture, NEVER merge. Manual dispatch only.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-review-${{ github.ref }}
  cancel-in-progress: false
env:
  HORIZON_TELEMETRY_URL: 'off'
  HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: cd5d9ce4b7c2e4f0e9ce0c4e28490c0fc91b6e1e
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: _capture
      - name: Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Build synthetic fixture binary, never release
        working-directory: launcher
        shell: pwsh
        env:
          HORIZON_MSA_CLIENT_ID: 00000000-0000-4000-8000-000000000000
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Scroll-only fixture captures and bounded log export
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          $failed=@()
          foreach ($mode in @('long','missing')) {
            foreach ($size in @(@(960,600),@(1028,780),@(1920,1080))) {
              $env:CAP_KIND='instrumented'
              $env:CAP_ROUTE=$mode
              $env:CAP_WIDTH=[string]$size[0]; $env:CAP_HEIGHT=[string]$size[1]
              $env:CAP=Join-Path $env:RUNNER_TEMP "captures-$mode-$($size[0])x$($size[1])"
              try { & '_capture/docs/qa/client-review-driver.ps1' } catch { $failed+="$mode-$size"; Write-Warning $_ }
              finally { $env:CAP_ROUTE="$mode-$($size[0])x$($size[1])"; & '_capture/docs/qa/client-review-export.ps1' }
            }
          }
          if ($failed.Count) { throw "Failed captures: $($failed -join ',')" }
