name: GoatTech Windows window qualification
# Scratch-only instrumented capture, NEVER merge. Manual dispatch only.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-review-${{ github.ref }}
  cancel-in-progress: false
env:
  HORIZON_TELEMETRY_URL: 'off'
  HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
jobs:
  capture:
    if: github.repository == 'GoatTech-42/goattech-launcher'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: PIN_SOURCE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: _capture
      - name: Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Build synthetic fixture binary, never release
        working-directory: launcher
        shell: pwsh
        env:
          HORIZON_MSA_CLIENT_ID: 00000000-0000-4000-8000-000000000000
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Input-free Mono sky captures and bounded log export
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference='Stop'
          $env:CAP_RUSTC_VERSION=(& rustc --version)
          $env:CAP_CARGO_VERSION=(& cargo --version)
          $failed=@()
          $script:ClientEncodedTotal=0; $script:ClientSummaryLines=0
          foreach ($mode in @('mono')) {
            foreach ($size in @(@(960,600),@(1028,780),@(1920,1080))) {
              if (Test-Path (Join-Path $env:RUNNER_TEMP 'client-capture-stop')) { throw 'Prior owned-process survivor; stop further captures' }
              $env:CAP_EXPECTED_SOURCE='PIN_SOURCE'
              $env:CAP_KIND='instrumented'
              $env:CAP_ROUTE=$mode
              $env:CAP_WIDTH=[string]$size[0]; $env:CAP_HEIGHT=[string]$size[1]
              $env:CAP=Join-Path $env:RUNNER_TEMP "captures-$mode-$($size[0])x$($size[1])"
              try { & '_capture/docs/qa/client-review-driver.ps1' } catch { $failed+="$mode-$($size[0])"; Write-Warning "Route failed; bounded receipts in export" }
              finally { $env:CAP_ROUTE="$mode-$($size[0])x$($size[1])"; . '_capture/docs/qa/client-review-export.ps1' }
            }
          }
          if ($failed.Count) { throw "Failed captures: $($failed -join ',')" }
