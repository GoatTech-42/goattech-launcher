name: GoatTech 1028 scroll calibration
# CI-only harness branch. Never merge this harness or its runner seam into main.
# Pins merged main f1fa45b, with synthetic offline names only.
# No repository secrets, real accounts, cache, release, or artifact upload.
# Exact shipping source only. No source seam, production changes or running-ref changes.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goattech-route-survey-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  HORIZON_TELEMETRY_URL: 'off'
  HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
jobs:
  capture:
    name: populated ${{ matrix.kind }} routes
    if: github.repository == 'GoatTech-42/goattech-launcher'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kind: [exact]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: f1fa45bba5e0835e6cabb1faf7be30a29591d5ed
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: _capture
      - name: Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Build fake-ID capture binary (never release)
        working-directory: launcher
        shell: pwsh
        env:
          HORIZON_MSA_CLIENT_ID: 00000000-0000-4000-8000-000000000000
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Stop'
          if ([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($env:HORIZON_MSA_CLIENT_ID))).ToLowerInvariant() -ne 'db8055e0e0307d5a016bec4dc338d69875eb0fb7e614a8b125b08fb082095d98') { throw 'Fake capture client ID changed; stop before building.' }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed: $LASTEXITCODE" }
      - name: Verify fake built-in configuration without signing in
        shell: pwsh
        timeout-minutes: 3
        env:
          HORIZON_LAUNCHER_HOME: ${{ runner.temp }}\configured-launcher-home
          HORIZON_HOME: ${{ runner.temp }}\configured-game-home
          EXPECTED_BUILD_CLIENT_ID: 00000000-0000-4000-8000-000000000000
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:HORIZON_MSA_CLIENT_ID -ErrorAction SilentlyContinue
          if (Test-Path Env:HORIZON_MSA_CLIENT_ID) { throw 'Runtime client ID must be absent.' }
          if ((Test-Path $env:HORIZON_LAUNCHER_HOME) -or (Test-Path $env:HORIZON_HOME)) { throw 'Expected fresh synthetic homes.' }
          $bin = Join-Path $PWD 'launcher\target\release\horizon-launcher.exe'
          $bytes = [IO.File]::ReadAllBytes($bin)
          if (-not [Text.Encoding]::ASCII.GetString($bytes).Contains($env:EXPECTED_BUILD_CLIENT_ID)) { throw 'Expected ID not embedded in final binary.' }
          Remove-Item Env:EXPECTED_BUILD_CLIENT_ID
          "binary-sha256: $((Get-FileHash $bin -Algorithm SHA256).Hash)"
          "binary-bytes: $($bytes.Length)"
          $out = Join-Path $env:RUNNER_TEMP 'configured-account.stdout'
          $err = Join-Path $env:RUNNER_TEMP 'configured-account.stderr'
          if ((Test-Path $out) -or (Test-Path $err)) { throw 'Expected fresh stdio paths.' }
          $proc = $null
          try {
            Add-Type -AssemblyName System.Windows.Forms
          $proc = Start-Process -FilePath $bin -ArgumentList '--json','account' -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $proc.WaitForExit(60000)) { throw 'Account list exceeded 60 seconds.' }
            $proc.WaitForExit()
            if ($proc.ExitCode -ne 0) { throw "Account list process failed: $($proc.ExitCode); stdout/stderr retained on runner only." }
            if ((Get-Item $err).Length -ne 0) { throw 'Account list wrote stderr; retained on runner only.' }
            $state = Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          } finally {
            if ($null -ne $proc) {
              if (-not $proc.HasExited) { $proc.Kill($true); $proc.WaitForExit() }
              $proc.Dispose()
            }
          }
          if ($state.sign_in_configured -ne $true -or $state.owner -ne $false -or @($state.accounts).Count -ne 0 -or @($state.offline).Count -ne 0) { throw 'Unexpected synthetic account state.' }
          "workflow-commit: $env:GITHUB_SHA"
          "source-commit: $((git rev-parse HEAD).Trim())"
          "rustc: $(rustc --version)"
          "cargo: $(cargo --version)"
          "runner-image: $env:ImageOS $env:ImageVersion"
          'runtime-client-id: absent'
          'embedded-client-id: fake capture ID only, not sign-in capable'
          'synthetic-sign-in-configured: true; owner: false; accounts: 0; offline: 0'
      - name: Capture isolated routes and export evidence
        shell: pwsh
        timeout-minutes: 18
        env:
          CAP_KIND: ${{ matrix.kind }}
          CAP_TARGET: populated
          CAP_ONLY_ROUTE: all
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          $ErrorActionPreference = 'Stop'
          $exact = @('worlds','screenshots','instance-mods')
          $routes = $exact
          if ($env:CAP_ONLY_ROUTE -ne 'all') {
            if ($env:CAP_ONLY_ROUTE -notin $exact) { throw 'Unsupported route' }
            $routes = @($routes | Where-Object { $_ -eq $env:CAP_ONLY_ROUTE })
          }
          $failed = @()
          foreach ($route in $routes) {
            $env:CAP_ROUTE = $route
            $env:CAP = Join-Path $env:RUNNER_TEMP "route-$env:CAP_KIND-$route"
            $env:HORIZON_LAUNCHER_HOME = Join-Path $env:RUNNER_TEMP "launcher-$env:CAP_KIND-$route"
            $env:HORIZON_HOME = Join-Path $env:RUNNER_TEMP "game-$env:CAP_KIND-$route"
            $env:PROBE_STATE = 'account'
            $env:CAP_MODE = 'home'; $env:LANG_CODE = 'en'
            try { & '_capture/docs/qa/route-driver.ps1' } catch { $failed += $route; Write-Warning "Route failed: $route $_" }
            finally { & '_capture/docs/qa/route-export.ps1' }
          }
          if ($failed.Count) { throw "Failed routes: $($failed -join ',')" }
