name: GoatTech Windows window qualification
# Temporary exact-source desktop capture. Never merge.
on:
  workflow_dispatch:
  push:
    branches: [tmp-main049-desktopcap-clean]
permissions:
  contents: write
concurrency:
  group: client-review-${{ github.ref }}
  cancel-in-progress: false
env:
  HORIZON_TELEMETRY_URL: 'off'
  HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
jobs:
  capture:
    if: github.repository == 'GoatTech-42/goattech-launcher'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 049bcb6af2aa5ee3b12cace497471ed851312f43
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: _capture
      - name: Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Build synthetic fixture binary, never release
        working-directory: launcher
        shell: pwsh
        env:
          HORIZON_MSA_CLIENT_ID: 00000000-0000-4000-8000-000000000000
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Exact-source full-desktop home and settings captures and bounded log export
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference='Stop'
          $env:CAP_RUSTC_VERSION=(& rustc --version)
          $env:CAP_CARGO_VERSION=(& cargo --version)
          $failed=@()
          $script:ClientEncodedTotal=0; $script:ClientSummaryLines=0
          foreach ($mode in @('home','settings')) {
            foreach ($size in ,@(960,600)) {
              if (Test-Path (Join-Path $env:RUNNER_TEMP 'client-capture-stop')) { throw 'Prior owned-process survivor; stop further captures' }
              $env:CAP_EXPECTED_SOURCE='049bcb6af2aa5ee3b12cace497471ed851312f43'
              $env:CAP_KIND='exact-source-test-profile'
              $env:CAP_ROUTE=$mode
              $env:CAP_WIDTH=[string]$size[0]; $env:CAP_HEIGHT=[string]$size[1]
              $env:CAP=Join-Path $env:RUNNER_TEMP "captures-$mode-$($size[0])x$($size[1])"
              try { & '_capture/docs/qa/client-review-driver.ps1' } catch { $failed+="$mode-$($size[0])"; Write-Warning "Route failed; bounded receipts in export" }
              finally { $env:CAP_ROUTE="$mode-$($size[0])x$($size[1])"; . '_capture/docs/qa/client-review-export.ps1' }
            }
          }
          if ($failed.Count) { throw "Failed captures: $($failed -join ',')" }
      - name: Publish bounded test-profile frames to temporary output branch
        shell: pwsh
        env:
          OUTPUT_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'capture-output-only'
          New-Item -ItemType Directory $out | Out-Null
          $manifest=@()
          foreach ($mode in @('home','settings')) {
            foreach ($frame in @('frame-01-top.png','frame-02-repeat.png')) {
              $input=Join-Path $env:RUNNER_TEMP "captures-$mode-960x600/$frame"
              $dest="$mode-$frame"
              $item=Get-Item -LiteralPath $input
              if ($item.Length -gt 4194304 -or $item.Length -lt 100) {throw 'PNG byte ceiling'}
              $bytes=[IO.File]::ReadAllBytes($input)
              if ([Convert]::ToHexString($bytes[0..7]) -ne '89504E470D0A1A0A') {throw 'Invalid PNG'}
              Copy-Item -LiteralPath $input -Destination (Join-Path $out $dest)
              $manifest+=@{file=$dest;bytes=$item.Length;sha256=(Get-FileHash $input -Algorithm SHA256).Hash}
            }
          }
          @{source='049bcb6af2aa5ee3b12cace497471ed851312f43';harness=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;profile='isolated all optional data off; fake build ID; no personal credentials';frames=$manifest} | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $out 'receipt.json')
          git -C $out init -b tmp-main049-desktopcap-output
          git -C $out add -- '*.png' receipt.json
          git -C $out -c user.name=GoatTech-42 -c user.email=156948079+GoatTech-42@users.noreply.github.com commit -m 'Temporary exact-source desktop capture evidence'
          $header=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:OUTPUT_TOKEN"))
          git -C $out -c "http.extraheader=AUTHORIZATION: basic $header" push https://github.com/GoatTech-42/goattech-launcher.git HEAD:refs/heads/tmp-main049-desktopcap-output
          if ($LASTEXITCODE -ne 0) {throw 'Temporary evidence push failed'}
