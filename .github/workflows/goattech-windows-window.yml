name: GoatTech Windows window qualification

# Manual, fresh-profile window evidence only. No account, game, real profile,
# telemetry, self-update, release, artifact/cache storage or self-hosted runner.
# Standard windows-latest on this public repository is the established free route.
# Paired exact sources pinned below; synthetic Home/Servers layout, no gameplay.
# Images and synthetic window state leave the runner in PUBLIC run logs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goattech-windows-window-${{ github.ref }}
  cancel-in-progress: true

env:
  HORIZON_TELEMETRY_URL: "off"
  HORIZON_LAUNCHER_NO_SELF_UPDATE: "1"

jobs:
  capture:
    name: page survey ${{ matrix.label }}
    if: github.repository == 'GoatTech-42/goattech-launcher'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: en, net: off, label: display-mode, page: instances, mode: home, width: 960, height: 600, source: '073fb3831bb7e3840c48e22446923cc9f8923648' }
          - { lang: en, net: off, label: oversized-native, page: instances, mode: home, width: 960, height: 600, source: '073fb3831bb7e3840c48e22446923cc9f8923648' }
    # Uncached cold build on a 4-core runner can take a while; compute is free
    # for this public repo, the capture step still has its own 3-min bound.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ matrix.source }}
      - name: Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Build configured release binary
        working-directory: launcher
        shell: pwsh
        env:
          HORIZON_MSA_CLIENT_ID: ${{ secrets.HORIZON_MSA_CLIENT_ID }}
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($env:HORIZON_MSA_CLIENT_ID))).ToLowerInvariant() -ne 'aea41f3c67b6424b9a1329e43a4d1e49387ab169c5e7abb2267d5bb560a03c11') { throw 'Repository client ID missing or changed; review before building.' }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed: $LASTEXITCODE" }
      - name: Verify built-in configuration without signing in
        shell: pwsh
        timeout-minutes: 3
        env:
          HORIZON_LAUNCHER_HOME: ${{ runner.temp }}\configured-launcher-home
          HORIZON_HOME: ${{ runner.temp }}\configured-game-home
          EXPECTED_BUILD_CLIENT_ID: ${{ secrets.HORIZON_MSA_CLIENT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:HORIZON_MSA_CLIENT_ID -ErrorAction SilentlyContinue
          if (Test-Path Env:HORIZON_MSA_CLIENT_ID) { throw 'Runtime client ID must be absent.' }
          if ((Test-Path $env:HORIZON_LAUNCHER_HOME) -or (Test-Path $env:HORIZON_HOME)) { throw 'Expected fresh synthetic homes.' }
          $bin = Join-Path $PWD 'launcher\target\release\horizon-launcher.exe'
          $bytes = [IO.File]::ReadAllBytes($bin)
          if (-not [Text.Encoding]::ASCII.GetString($bytes).Contains($env:EXPECTED_BUILD_CLIENT_ID)) { throw 'Expected ID not embedded in final binary.' }
          Remove-Item Env:EXPECTED_BUILD_CLIENT_ID
          "binary-sha256: $((Get-FileHash $bin -Algorithm SHA256).Hash)"
          "binary-bytes: $($bytes.Length)"
          $out = Join-Path $env:RUNNER_TEMP 'configured-account.stdout'
          $err = Join-Path $env:RUNNER_TEMP 'configured-account.stderr'
          if ((Test-Path $out) -or (Test-Path $err)) { throw 'Expected fresh stdio paths.' }
          $proc = $null
          try {
            Add-Type -AssemblyName System.Windows.Forms
          $proc = Start-Process -FilePath $bin -ArgumentList '--json','account' -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $proc.WaitForExit(60000)) { throw 'Account list exceeded 60 seconds.' }
            $proc.WaitForExit()
            if ($proc.ExitCode -ne 0) { throw "Account list process failed: $($proc.ExitCode); stdout/stderr retained on runner only." }
            if ((Get-Item $err).Length -ne 0) { throw 'Account list wrote stderr; retained on runner only.' }
            $state = Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          } finally {
            if ($null -ne $proc) {
              if (-not $proc.HasExited) { $proc.Kill($true); $proc.WaitForExit() }
              $proc.Dispose()
            }
          }
          if ($state.sign_in_configured -ne $true -or $state.owner -ne $false -or @($state.accounts).Count -ne 0 -or @($state.offline).Count -ne 0) { throw 'Unexpected synthetic account state.' }
          "workflow-commit: $env:GITHUB_SHA"
          "source-commit: $((git rev-parse HEAD).Trim())"
          "rustc: $(rustc --version)"
          "cargo: $(cargo --version)"
          "runner-image: $env:ImageOS $env:ImageVersion"
          'runtime-client-id: absent'
          'embedded-client-id: exact match'
          'synthetic-sign-in-configured: true; owner: false; accounts: 0; offline: 0'
      - name: Run, capture frames, qualify window state
        shell: pwsh
        # Step-level hard bound: a hung capture phase dies here in 3
        # minutes instead of burning the 90-min job timeout. Runner-forced
        # cancellation can bypass the script's finally cleanup (best-effort only).
        timeout-minutes: 4
        env:
          HORIZON_LAUNCHER_HOME: ${{ runner.temp }}\launcher-home
          HORIZON_HOME: ${{ runner.temp }}\game-home
          LANG_CODE: ${{ matrix.lang }}
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          CAP: ${{ runner.temp }}\captures
          HORIZON_LAUNCHER_PAGE: ${{ matrix.page }}
          CAP_METHOD: ${{ matrix.label }}
          CAP_MODE: ${{ matrix.mode }}
          CAP_WIDTH: ${{ matrix.width }}
          CAP_HEIGHT: ${{ matrix.height }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force $env:CAP | Out-Null
          $info = "$env:CAP\window-info.txt"
          # C# as ONE single-quoted line: no here-string anywhere in this file.
          $src = 'using System;using System.Runtime.InteropServices;public class WinCap{[DllImport("user32.dll",SetLastError=true)]public static extern bool SetWindowPos(IntPtr h,IntPtr after,int x,int y,int w,int height,uint flags);[DllImport("user32.dll")]public static extern IntPtr GetLastActivePopup(IntPtr h);[DllImport("user32.dll")]public static extern IntPtr GetForegroundWindow();[DllImport("user32.dll")]public static extern uint GetWindowThreadProcessId(IntPtr h,out uint p);[DllImport("user32.dll")]public static extern uint GetDpiForWindow(IntPtr h);[DllImport("user32.dll")]public static extern bool GetClientRect(IntPtr h,out RECT r);[DllImport("user32.dll")]public static extern bool GetWindowRect(IntPtr h,out RECT r);[DllImport("user32.dll")]public static extern bool IsWindowVisible(IntPtr h);[DllImport("user32.dll")]public static extern bool IsIconic(IntPtr h);[DllImport("user32.dll")]public static extern bool PrintWindow(IntPtr h,IntPtr dc,uint flags);[DllImport("user32.dll")]public static extern bool MoveWindow(IntPtr h,int x,int y,int w,int h2,bool r);[DllImport("user32.dll")]public static extern bool SetCursorPos(int x,int y);[DllImport("user32.dll")]public static extern void mouse_event(uint f,uint dx,uint dy,uint d,UIntPtr e);[DllImport("user32.dll")]public static extern bool SetForegroundWindow(IntPtr h);public struct RECT{public int Left,Top,Right,Bottom;}}'
          Add-Type -TypeDefinition $src -ReferencedAssemblies System.Drawing
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          $bin = "$PWD\launcher\target\release\horizon-launcher.exe"
          $binHash = (Get-FileHash $bin -Algorithm SHA256).Hash
          $actual = (git rev-parse HEAD).Trim()
          "workflow-commit: $env:GITHUB_SHA" | Out-File $info
          "source-commit: $actual" | Out-File $info -Append
          "rustc: $(rustc --version)" | Out-File $info -Append
          "cargo: $(cargo --version)" | Out-File $info -Append
          "os: $([System.Environment]::OSVersion.VersionString)" | Out-File $info -Append
          "runner-image: $env:ImageOS $env:ImageVersion" | Out-File $info -Append
          "binary-sha256: $binHash" | Out-File $info -Append
          New-Item -ItemType Directory -Force $env:HORIZON_LAUNCHER_HOME | Out-Null
          @{install_new_versions=$false;skip_opening=($env:CAP_MODE -ne 'opening');selected='v2026.10.15'} | ConvertTo-Json | Set-Content (Join-Path $env:HORIZON_LAUNCHER_HOME 'settings.json')
          $fake = Join-Path $env:HORIZON_LAUNCHER_HOME 'versions/v2026.10.15'
          New-Item -ItemType Directory -Force $fake | Out-Null
          '' | Set-Content (Join-Path $fake '.installed')
          '{"minecraft":{"version":"26.3"}}' | Set-Content (Join-Path $fake 'research-lock.json')
          $binaryText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($bin))
          if ($binaryText.Contains('my.sculkhosting.com/ref/horizon') -or $binaryText.Contains('HORIZON15')) { throw 'Referral payload found in build' }
          'sponsor-check: referral and promo strings absent; synthetic offline fixture; no runnable game/accounts' | Out-File $info -Append
          $proc = Start-Process -FilePath $bin -PassThru -RedirectStandardOutput "$env:CAP\launcher.stdout" -RedirectStandardError "$env:CAP\launcher.stderr"
          $checksPass = $false
          try {
            # Bounded wait for the process's main window (Process.MainWindowHandle:
            # no EnumWindows callback, no delegate binding).
            $hwnd = [IntPtr]::Zero
            for ($i = 0; $i -lt 1200 -and $hwnd -eq [IntPtr]::Zero; $i++) {
              Start-Sleep -Milliseconds 50
              $proc.Refresh()
              if ($proc.HasExited) { throw "FAIL: launcher exited before a window (code $($proc.ExitCode))" }
              $h = $proc.MainWindowHandle
              if ($h -ne [IntPtr]::Zero -and [WinCap]::IsWindowVisible($h) -and -not [WinCap]::IsIconic($h)) {
                $r = New-Object WinCap+RECT
                if ([WinCap]::GetWindowRect($h, [ref]$r) -and ($r.Right - $r.Left) -ge 200 -and ($r.Bottom - $r.Top) -ge 200) {
                  $hwnd = $h
                  "initial-window: $($r.Right - $r.Left)x$($r.Bottom - $r.Top) hwnd=$hwnd title='$($proc.MainWindowTitle)'" | Out-File $info -Append
                }
              }
            }
            if ($hwnd -eq [IntPtr]::Zero) { throw "FAIL: no visible owned main window >=200x200 within 60s" }
            # Three capture attempts. Window state is re-validated and recorded per
            # frame; each PrintWindow runs in a child job with a BEST-EFFORT 30s
            # wait (see header: Stop-Job on a native hang may itself block).
            $okCount = 0; $seenCount = 0
            $savedSteps = @{}
            function Size-Client($width,$height) {
              $h=$proc.MainWindowHandle
              $outer=New-Object WinCap+RECT; $client=New-Object WinCap+RECT
              [WinCap]::GetWindowRect($h,[ref]$outer) | Out-Null
              [WinCap]::GetClientRect($h,[ref]$client) | Out-Null
              $dw=($outer.Right-$outer.Left)-$client.Right; $dh=($outer.Bottom-$outer.Top)-$client.Bottom
              if ($env:CAP_METHOD -eq 'oversized-native') {
                $sized=[WinCap]::SetWindowPos($h,[IntPtr]::Zero,0,0,($width+$dw),($height+$dh),0x0544)
                "resize-method: SetWindowPos NOSENDCHANGING result=$sized requested-client=${width}x${height}" | Out-File $info -Append
              } else {
                [WinCap]::MoveWindow($h,0,0,($width+$dw),($height+$dh),$true) | Out-Null
              }
            }
            if ($env:CAP_MODE -eq 'opening') {
              Size-Client ([int]$env:CAP_WIDTH) ([int]$env:CAP_HEIGHT)
              $steps=@(@{n='opening-early'; ms=150},@{n='opening-held'; ms=250},@{n='opening-late'; ms=350})
            } else {
              $steps = @(
                @{n='dialog'; w=8},
                @{n='sign-in-prompt'; c=@(500,649); w=3},
                @{n='account-dismissed'; k='{ESC}'; w=2},
                @{n='large-1920x1080'; r=@(1920,1080); display=@(2560,1440); w=5},
                @{n='large-2560x1440'; r=@(2560,1440); display=@(3840,2160); w=5}
              )
            }
            for ($f = 1; $f -le $steps.Count; $f++) {
              $st = $steps[$f-1]
              if ($st.display -and $env:CAP_METHOD -eq 'display-mode') {
                $cmd=Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue
                if ($cmd) {
                  try { Set-DisplayResolution -Width $st.display[0] -Height $st.display[1] -Force -ErrorAction Stop | Out-String | Out-File $info -Append }
                  catch { "display-change-failed: $_" | Out-File $info -Append }
                } else { 'display-change-unavailable: Set-DisplayResolution missing' | Out-File $info -Append }
                Start-Sleep -Seconds 2
              }
              "desktop: $([System.Windows.Forms.SystemInformation]::VirtualScreen) method=$env:CAP_METHOD" | Out-File $info -Append
              if ($st.r) { Size-Client $st.r[0] $st.r[1] }
              if ($st.c) { $pr = New-Object WinCap+RECT; [WinCap]::GetWindowRect($proc.MainWindowHandle, [ref]$pr) | Out-Null; [WinCap]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null; Start-Sleep -Milliseconds 300; [WinCap]::SetCursorPos($pr.Left + $st.c[0], $pr.Top + $st.c[1]) | Out-Null; Start-Sleep -Milliseconds 300; [WinCap]::mouse_event(2,0,0,0,[UIntPtr]::Zero); Start-Sleep -Milliseconds 80; [WinCap]::mouse_event(4,0,0,0,[UIntPtr]::Zero) }
              if ($st.d) { $pr = New-Object WinCap+RECT; [WinCap]::GetWindowRect($proc.MainWindowHandle, [ref]$pr) | Out-Null; [WinCap]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null; Start-Sleep -Milliseconds 300; [WinCap]::SetCursorPos($pr.Left + $st.d[0], $pr.Top + $st.d[1]) | Out-Null; Start-Sleep -Milliseconds 300; [WinCap]::mouse_event(2,0,0,0,[UIntPtr]::Zero); foreach ($k in 1..8) { Start-Sleep -Milliseconds 60; [WinCap]::SetCursorPos($pr.Left + $st.d[0] + [int]($st.d[2] * $k / 8), $pr.Top + $st.d[1]) | Out-Null }; Start-Sleep -Milliseconds 100; [WinCap]::mouse_event(4,0,0,0,[UIntPtr]::Zero) }
              if ($st.k) {
                [WinCap]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null
                Start-Sleep -Milliseconds 150
                if ([WinCap]::GetForegroundWindow() -ne $proc.MainWindowHandle) { throw 'Main window not foreground; no keyboard input' }
                [System.Windows.Forms.SendKeys]::SendWait($st.k)
              }
              if ($st.s) { $pr = New-Object WinCap+RECT; [WinCap]::GetWindowRect($proc.MainWindowHandle, [ref]$pr) | Out-Null; [WinCap]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null; Start-Sleep -Milliseconds 300; [WinCap]::SetCursorPos($pr.Left + $st.s[0], $pr.Top + $st.s[1]) | Out-Null; Start-Sleep -Milliseconds 300; $d = [BitConverter]::ToUInt32([BitConverter]::GetBytes([int]$st.s[2]),0); [WinCap]::mouse_event(2048,0,0,$d,[UIntPtr]::Zero) }
              if ($st.ms) { Start-Sleep -Milliseconds $st.ms } else { Start-Sleep -Seconds $st.w }
              $proc.Refresh()
              if ($proc.HasExited) { throw "FAIL: launcher died before frame $f (code $($proc.ExitCode))" }
              $h = $proc.MainWindowHandle
              if ($h -eq [IntPtr]::Zero) { "frame ${f}: SKIPPED main window handle lost" | Out-File $info -Append; continue }
              $r = New-Object WinCap+RECT
              $rectOk = [WinCap]::GetWindowRect($h, [ref]$r)
              $w = if ($rectOk) { $r.Right - $r.Left } else { 0 }
              $hgt = if ($rectOk) { $r.Bottom - $r.Top } else { 0 }
              $vis = [WinCap]::IsWindowVisible($h); $iconic = [WinCap]::IsIconic($h)
              $state = "visible=$vis iconic=$iconic geometry=${w}x${hgt}"
              if (-not $rectOk -or -not $vis -or $iconic -or $w -lt 200 -or $hgt -lt 200) {
                "frame ${f}: WINDOW-NOT-OK $state - capture skipped" | Out-File $info -Append; continue
              }
              # Geometry/pixel ceiling BEFORE any bitmap allocation: an absurd
              # window must not allocate an unbounded bitmap.
              if ($w -gt 3840 -or $hgt -gt 3840 -or [int64]$w * $hgt -gt 16777216) {
                "frame ${f}: CAPTURE-SKIPPED-OVERSIZE $state (limits 3840px/16MP)" | Out-File $info -Append; continue
              }
              $seenCount++
              $png = "$env:CAP\frame-$($f.ToString('00'))-$($st.n).png"
              $client=New-Object WinCap+RECT
              [WinCap]::GetClientRect($h,[ref]$client) | Out-Null
              "viewport: frame=$f client=$($client.Right)x$($client.Bottom) dpi=$([WinCap]::GetDpiForWindow($h))" | Out-File $info -Append
              $bmp=New-Object System.Drawing.Bitmap $w,$hgt
              $g=[System.Drawing.Graphics]::FromImage($bmp); $dc=[IntPtr]::Zero
              try {
                $dc=$g.GetHdc(); $ok=[WinCap]::PrintWindow($h,$dc,2)
                $g.ReleaseHdc($dc); $dc=[IntPtr]::Zero
                if (-not $ok) { throw 'PrintWindow refused capture' }
                $bmp.Save($png,[System.Drawing.Imaging.ImageFormat]::Png)
                $okCount++
                $savedSteps[$st.n] = $png
              } finally {
                if ($dc -ne [IntPtr]::Zero) { $g.ReleaseHdc($dc) }
                $g.Dispose();$bmp.Dispose()
              }
            }
            $proc.Refresh()
            if ($proc.HasExited) { throw "FAIL: launcher exited during captures (code $($proc.ExitCode))" }
            # Automation checks only. Window claim is what the per-frame lines show.
            "AUTOMATION-CHECKS: process-alive=whole-phase initial-visible-owned-window>=200x200=yes frames-window-ok=$seenCount/$($steps.Count) captures-accepted=$okCount/$($steps.Count)" | Out-File $info -Append
            if ($seenCount -eq 0) { "WINDOW-AFTER-INITIAL: unverified (every frame skipped)" | Out-File $info -Append }
            "NOT-PROVEN: rendering/pixels/input/consent/game-launch/GPU/continuous-presence - frames require human inspection" | Out-File $info -Append
            $required = @('account-dismissed','large-1920x1080','large-2560x1440')
            foreach ($name in $required) {
              if (-not $savedSteps.ContainsKey($name) -or -not (Test-Path -LiteralPath $savedSteps[$name]) -or (Get-Item -LiteralPath $savedSteps[$name]).Length -eq 0) {
                throw "Required saved capture missing or empty: $name"
              }
            }
            if ($okCount -ne $steps.Count) { throw "Saved capture count $okCount does not match requested step count $($steps.Count)" }
            'NOT-PROVEN: unobscured requested page or dismissed consent/account screens until pixel review; Escape may be consumed by consent if the earlier click missed. Requested names are labels only; use measured client size and DPI. Foreground check/send has a race; pointer clicks are coordinate-based.' | Out-File $info -Append
            $checksPass = $true
          } finally {
            # Best-effort cleanup: any leftover capture jobs, then the launcher's main
            # process only - children are not tracked and no tree cleanup is claimed.
            Get-Job | Stop-Job -ErrorAction SilentlyContinue | Out-Null
            Get-Job | Remove-Job -Force -ErrorAction SilentlyContinue
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
          if (-not $checksPass) { exit 1 }
      # Evidence transport with ZERO artifact storage: frames as base64 blocks in
      # the raw run log, stats in the step summary. Runs even when the capture
      # step failed or was killed - whatever frames exist get exported.
      - name: Export evidence to log and summary (no artifact storage)
        if: always()
        shell: pwsh
        timeout-minutes: 2
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          CAP: ${{ runner.temp }}\captures
          HORIZON_LAUNCHER_PAGE: ${{ matrix.page }}
          CAP_METHOD: ${{ matrix.label }}
          CAP_MODE: ${{ matrix.mode }}
          CAP_WIDTH: ${{ matrix.width }}
          CAP_HEIGHT: ${{ matrix.height }}
        run: |
          $ErrorActionPreference = 'Continue'
          # Export ceilings, checked BEFORE reading each file: no unbounded
          # ReadAllBytes/base64 into the log. Per-file raw limit 1,500,000 bytes;
          # total ENCODED base64 characters across all frames 6,000,000.
          $maxPngBytes = 4000000
          $maxEncodedTotal = 16000000
          $encodedTotal = 0
          $info = "$env:CAP\window-info.txt"
          if (Test-Path $info) {
            Get-Content $info | ForEach-Object { Write-Output $_ }
            Get-Content $info | ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY "| $_ |" }
            Add-Content $env:GITHUB_STEP_SUMMARY "`nFrames are base64 blocks in this run's raw log between ###FRAME-BEGIN and ###FRAME-END markers. Decode: copy a block, then ``base64 -d > frame.png``."
          } else {
            Write-Output "NO-EVIDENCE: window-info.txt missing (capture step died before writing)"
            Add-Content $env:GITHUB_STEP_SUMMARY "NO-EVIDENCE: capture step produced no window-info - see job log."
          }
          $frames = @(Get-ChildItem "$env:CAP\frame-*.png" -ErrorAction SilentlyContinue)
          if ($frames.Count -eq 0) { Write-Output "###FRAMES-NONE found=0 expected<=3 - no frame files present" }
          elseif ($frames.Count -lt 3) { Write-Output "###FRAMES-INCOMPLETE found=$($frames.Count) expected=3" }
          foreach ($png in $frames) {
            $len = $png.Length
            $enc = 4 * [Math]::Ceiling($len / 3)
            if ($len -gt $maxPngBytes) {
              Write-Output "###FRAME-SKIP $($png.Name) reason=oversize bytes=$len limit=$maxPngBytes"
              continue
            }
            if ($encodedTotal + $enc -gt $maxEncodedTotal) {
              Write-Output "###FRAME-SKIP $($png.Name) reason=total-ceiling encoded-would-be=$($encodedTotal + $enc) limit=$maxEncodedTotal"
              continue
            }
            $bytes = [IO.File]::ReadAllBytes($png.FullName)
            $sha = (Get-FileHash $png.FullName -Algorithm SHA256).Hash
            Write-Output "###FRAME-BEGIN $($png.Name) sha256=$sha bytes=$($bytes.Length)"
            $b64 = [Convert]::ToBase64String($bytes)
            for ($i = 0; $i -lt $b64.Length; $i += 76) {
              Write-Output $b64.Substring($i, [Math]::Min(76, $b64.Length - $i))
            }
            Write-Output "###FRAME-END $($png.Name)"
            $encodedTotal += $enc
          }
          Write-Output "###EXPORT-SUMMARY frames-present=$($frames.Count) encoded-chars=$encodedTotal ceiling=$maxEncodedTotal"
