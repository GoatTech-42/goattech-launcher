name: GoatTech pinned route survey
# Separate exact-tip and runner-instrumented jobs. No production source or running ref changes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Pinned source: P20 large survey, combined s=1 sanity, or P21 review'
        type: choice
        options: [p20, combined, p21]
        default: p20
      route:
        description: 'all or a single route listed in docs/qa/route-survey.md'
        type: string
        default: all
      actions:
        description: 'Optional calibrated 1028x780 outer-window actions, same format as overlayscap18'
        type: string
        default: '[]'
permissions:
  contents: read
concurrency:
  group: goattech-route-survey-${{ github.ref }}-${{ inputs.target }}-${{ inputs.route }}
  cancel-in-progress: false
env:
  HORIZON_TELEMETRY_URL: 'off'
  HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
jobs:
  capture:
    name: ${{ inputs.target }} ${{ matrix.kind }} routes
    if: github.repository == 'GoatTech-42/goattech-launcher'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kind: [exact, instrumented]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.target == 'p21' && 'b47844135a09a1d0990847709590e1d34029ffaa'
            || inputs.target == 'combined' && 'c5ef0ce75222bf4d223f21ece8b90bc609abc153'
            || '43c56fa7583e89c453969a1f6e32ceef01fb5418' }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: _capture
      - name: Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Verify and apply runner-only seam in separate job
        if: matrix.kind == 'instrumented'
        shell: pwsh
        run: |-
          $ErrorActionPreference = 'Stop'
          $patch = '_capture/docs/qa/route-capture-only.patch'
          if ((Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant() -ne '28bcaf3fe1eef9ea5bae0b80c939e6661fe666f0d3a002c358f4d82c91cbe7c2') { throw 'Capture seam hash mismatch' }
          git apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Capture seam does not apply to pinned source' }
          git apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Capture seam apply failed' }
          "INSTRUMENTED: source tip plus runner-only patch sha256 28bcaf3fe1eef9ea5bae0b80c939e6661fe666f0d3a002c358f4d82c91cbe7c2; never shipping source"
      - name: Build configured release binary
        working-directory: launcher
        shell: pwsh
        env:
          HORIZON_MSA_CLIENT_ID: ${{ secrets.HORIZON_MSA_CLIENT_ID }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Stop'
          if ([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($env:HORIZON_MSA_CLIENT_ID))).ToLowerInvariant() -ne 'aea41f3c67b6424b9a1329e43a4d1e49387ab169c5e7abb2267d5bb560a03c11') { throw 'Repository client ID missing or changed; review before building.' }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed: $LASTEXITCODE" }
      - name: Verify built-in configuration without signing in
        shell: pwsh
        timeout-minutes: 3
        env:
          HORIZON_LAUNCHER_HOME: ${{ runner.temp }}\configured-launcher-home
          HORIZON_HOME: ${{ runner.temp }}\configured-game-home
          EXPECTED_BUILD_CLIENT_ID: ${{ secrets.HORIZON_MSA_CLIENT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:HORIZON_MSA_CLIENT_ID -ErrorAction SilentlyContinue
          if (Test-Path Env:HORIZON_MSA_CLIENT_ID) { throw 'Runtime client ID must be absent.' }
          if ((Test-Path $env:HORIZON_LAUNCHER_HOME) -or (Test-Path $env:HORIZON_HOME)) { throw 'Expected fresh synthetic homes.' }
          $bin = Join-Path $PWD 'launcher\target\release\horizon-launcher.exe'
          $bytes = [IO.File]::ReadAllBytes($bin)
          if (-not [Text.Encoding]::ASCII.GetString($bytes).Contains($env:EXPECTED_BUILD_CLIENT_ID)) { throw 'Expected ID not embedded in final binary.' }
          Remove-Item Env:EXPECTED_BUILD_CLIENT_ID
          "binary-sha256: $((Get-FileHash $bin -Algorithm SHA256).Hash)"
          "binary-bytes: $($bytes.Length)"
          $out = Join-Path $env:RUNNER_TEMP 'configured-account.stdout'
          $err = Join-Path $env:RUNNER_TEMP 'configured-account.stderr'
          if ((Test-Path $out) -or (Test-Path $err)) { throw 'Expected fresh stdio paths.' }
          $proc = $null
          try {
            Add-Type -AssemblyName System.Windows.Forms
          $proc = Start-Process -FilePath $bin -ArgumentList '--json','account' -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $proc.WaitForExit(60000)) { throw 'Account list exceeded 60 seconds.' }
            $proc.WaitForExit()
            if ($proc.ExitCode -ne 0) { throw "Account list process failed: $($proc.ExitCode); stdout/stderr retained on runner only." }
            if ((Get-Item $err).Length -ne 0) { throw 'Account list wrote stderr; retained on runner only.' }
            $state = Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          } finally {
            if ($null -ne $proc) {
              if (-not $proc.HasExited) { $proc.Kill($true); $proc.WaitForExit() }
              $proc.Dispose()
            }
          }
          if ($state.sign_in_configured -ne $true -or $state.owner -ne $false -or @($state.accounts).Count -ne 0 -or @($state.offline).Count -ne 0) { throw 'Unexpected synthetic account state.' }
          "workflow-commit: $env:GITHUB_SHA"
          "source-commit: $((git rev-parse HEAD).Trim())"
          "rustc: $(rustc --version)"
          "cargo: $(cargo --version)"
          "runner-image: $env:ImageOS $env:ImageVersion"
          'runtime-client-id: absent'
          'embedded-client-id: exact match'
          'synthetic-sign-in-configured: true; owner: false; accounts: 0; offline: 0'
      - name: Capture isolated routes and export evidence
        shell: pwsh
        timeout-minutes: 18
        env:
          CAP_KIND: ${{ matrix.kind }}
          CAP_TARGET: ${{ inputs.target }}
          CAP_ONLY_ROUTE: ${{ inputs.route }}
          PROBE_ACTIONS: ${{ inputs.actions }}
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          $ErrorActionPreference = 'Stop'
          $exact = @('home','instances','mods','modpacks','resourcepacks','shaders','datapacks','servers','versions','notes','settings','new-instance','edit-instance','sign-in','getting-ready','export','launch','skin','worlds','instance-mods','multiplayer','packs','screenshots')
          $instrumented = @('export','launch','skin','console','native-log','instance-mods','packs','world-datapacks','internet','modpack-detail')
          $routes = if ($env:CAP_KIND -eq 'exact') {$exact} else {$instrumented}
          if ($env:CAP_ONLY_ROUTE -ne 'all') {
            if ($env:CAP_ONLY_ROUTE -notin ($exact + $instrumented)) { throw 'Unsupported route' }
            $routes = @($routes | Where-Object { $_ -eq $env:CAP_ONLY_ROUTE })
          }
          if ($env:PROBE_ACTIONS -ne '[]' -and $env:CAP_ONLY_ROUTE -eq 'all') { throw 'Input requires a single calibrated route' }
          if ($env:CAP_KIND -eq 'instrumented') { $env:PROBE_ACTIONS = '[]' }
          $failed = @()
          foreach ($route in $routes) {
            $env:CAP_ROUTE = $route
            $env:CAP = Join-Path $env:RUNNER_TEMP "route-$env:CAP_KIND-$route"
            $env:HORIZON_LAUNCHER_HOME = Join-Path $env:RUNNER_TEMP "launcher-$env:CAP_KIND-$route"
            $env:HORIZON_HOME = Join-Path $env:RUNNER_TEMP "game-$env:CAP_KIND-$route"
            $env:PROBE_STATE = 'account'
            $env:CAP_MODE = 'home'; $env:LANG_CODE = 'en'
            try { & '_capture/docs/qa/route-driver.ps1' } catch { $failed += $route; Write-Warning "Route failed: $route $_" }
            finally { & '_capture/docs/qa/route-export.ps1' }
          }
          if ($failed.Count) { throw "Failed routes: $($failed -join ',')" }
