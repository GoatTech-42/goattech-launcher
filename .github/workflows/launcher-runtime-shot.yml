name: launcher-runtime-shot
# On-demand (this file changing on the integration branch, or manual dispatch), Linux-only,
# GitHub-hosted runtime capture: builds the launcher and photographs real rendered frames under a
# headless cage/wlroots compositor. No release, no publishing, no self-hosted runners, no secrets. The
# artifact is review evidence only; it is not a running-app qualification by itself and not a >9
# review. The renderer/compositor capture path is a hypothesis until actual pixels are inspected.

on:
  workflow_dispatch:
  push:
    # Fires only when this workflow file itself changes on the integration branch:
    # the normal-CI invocation path for the manual capture, nothing wider.
    branches: [integrate-nov2-batch-20261103]
    paths: ['.github/workflows/launcher-runtime-shot.yml']

permissions:
  contents: read

concurrency:
  group: launcher-runtime-shot-${{ github.ref }}
  cancel-in-progress: true

env:
  HORIZON_TELEMETRY_URL: "off"
  HORIZON_LAUNCHER_NO_SELF_UPDATE: "1"

jobs:
  capture:
    name: headless wayland runtime capture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: GPUI and compositor libraries (mirrors launcher.yml apt list + cage/grim/mesa)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev cage grim wlr-randr mesa-vulkan-drivers vulkan-tools
      - name: Build launcher
        working-directory: launcher
        run: cargo build --release --locked
      - name: Run and capture real frames
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
          XDG_PICTURES_DIR: ${{ runner.temp }}/captures
          WLR_BACKENDS: headless
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          HORIZON_LAUNCHER_HOME: ${{ runner.temp }}/launcher-home
          HOME: ${{ runner.temp }}/shot-home
        run: |
          set -euo pipefail
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_PICTURES_DIR" "$HOME" && chmod 700 "$XDG_RUNTIME_DIR"
          setsid cage -- "$GITHUB_WORKSPACE/launcher/target/release/horizon-launcher" >"$RUNNER_TEMP/cage.log" 2>&1 &
          cage_pid=$!
          cleanup() {
            # cage runs in its own process group (setsid): signal the group so the launcher
            # child terminates too; escalate to KILL after a bounded 5s wait.
            kill -TERM -- -"$cage_pid" 2>/dev/null || kill "$cage_pid" 2>/dev/null || true
            for i in 1 2 3 4 5; do kill -0 "$cage_pid" 2>/dev/null || break; sleep 1; done
            kill -KILL -- -"$cage_pid" 2>/dev/null || true
            cp "$RUNNER_TEMP/cage.log" "$XDG_PICTURES_DIR/" 2>/dev/null || true
          }
          trap cleanup EXIT
          # cage picks its socket with wl_display_add_socket_auto: discover the actual name,
          # never assume it (its child gets it via env; standalone clients like grim need it set).
          sock=""
          for i in $(seq 1 30); do
            for cand in "$XDG_RUNTIME_DIR"/wayland-*; do
              [ -S "$cand" ] && { sock=$(basename "$cand"); break; }
            done
            [ -n "$sock" ] && break
            sleep 1
          done
          [ -n "$sock" ] || { echo "FAIL: compositor socket never appeared"; exit 1; }
          echo "compositor socket: $sock"
          sleep 5
          kill -0 "$cage_pid" 2>/dev/null || { echo "FAIL: cage exited right after start (see cage.log)"; exit 1; }
          WAYLAND_DISPLAY="$sock" timeout 20 wlr-randr --output HEADLESS-1 --mode 1440x900 >>"$RUNNER_TEMP/cage.log" 2>&1 \
            || echo "note: 1440x900 mode set failed; capturing at compositor default size" >>"$RUNNER_TEMP/cage.log"
          for t in 1 2 3; do
            sleep 30
            kill -0 "$cage_pid" 2>/dev/null || { echo "FAIL: cage (and its launcher child) exited before attempt $t"; exit 1; }
            WAYLAND_DISPLAY="$sock" timeout 20 grim "$XDG_PICTURES_DIR/wayland-screenshot-$t.png" || { echo "FAIL: grim attempt $t"; exit 1; }
            [ -s "$XDG_PICTURES_DIR/wayland-screenshot-$t.png" ] || { echo "FAIL: empty frame on attempt $t"; exit 1; }
            mv "$XDG_PICTURES_DIR/wayland-screenshot-$t.png" "$XDG_PICTURES_DIR/frame-$t.png"
          done
          echo "captured 3 frames"
          ls -la "$XDG_PICTURES_DIR"
      - name: Evidence manifest
        if: always()
        run: |
          mkdir -p "${{ runner.temp }}/captures"
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "github_sha=${{ github.sha }}"
            echo "workflow_sha=${{ github.workflow_sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            [ -f launcher/target/release/horizon-launcher ] && echo "binary_sha256=$(sha256sum launcher/target/release/horizon-launcher | awk '{print $1}')"
            rustc --version
            cargo --version
            dpkg -l cage grim wlr-randr mesa-vulkan-drivers 2>/dev/null | grep '^ii' || true
            vulkaninfo --summary 2>/dev/null | grep -i -m2 "deviceName\|driverName" || true
          } | tee "${{ runner.temp }}/captures/manifest.txt"
      - name: Upload frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launcher-runtime-shot
          path: ${{ runner.temp }}/captures/
          retention-days: 5
          if-no-files-found: error
