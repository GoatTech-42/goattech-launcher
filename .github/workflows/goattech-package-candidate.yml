name: GoatTech portable package candidate

# Manual build-only preparation, never a release or deployment. Dispatch only
# after the source, intended artifact audience and remaining gates are reviewed.
on:
  workflow_dispatch:
    inputs:
      keep_artifact:
        description: 'Keep the candidate as a 7-day workflow artifact (a public repository lets any signed-in GitHub user download it; only after the audience is admitted)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: goattech-package-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  HORIZON_TELEMETRY_URL: 'off'
  HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
  HORIZON_LAUNCHER_VERSION: '1.0.0-rc.1'

jobs:
  package:
    if: github.repository == 'GoatTech-42/goattech-launcher'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            binary: horizon-launcher.exe
            rustflags: '-C target-feature=+crt-static'
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            binary: horizon-launcher
            rustflags: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - name: Package contract tests
        shell: bash
        run: python -m unittest discover -s tools/tests -v
      - name: Build configured candidate
        working-directory: launcher
        shell: bash
        env:
          HORIZON_MSA_CLIENT_ID: ${{ secrets.HORIZON_MSA_CLIENT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os
          assert hashlib.sha256(os.environ['HORIZON_MSA_CLIENT_ID'].encode()).hexdigest() == 'aea41f3c67b6424b9a1329e43a4d1e49387ab169c5e7abb2267d5bb560a03c11', 'Configured client ID missing or changed'
          PY
          cargo build --release --locked
      - name: Verify version and embedded configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(launcher/target/release/${{ matrix.binary }} --version)" = "horizon-launcher $HORIZON_LAUNCHER_VERSION"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          binary = Path('launcher/target/release/${{ matrix.binary }}').read_bytes()
          # The known public app identifier is checked without printing it.
          import os
          expected = os.environ['EXPECTED_CLIENT_ID'].encode()
          assert hashlib.sha256(expected).hexdigest() == 'aea41f3c67b6424b9a1329e43a4d1e49387ab169c5e7abb2267d5bb560a03c11'
          assert expected in binary, 'Expected configured client ID is absent'
          PY
        env:
          EXPECTED_CLIENT_ID: ${{ secrets.HORIZON_MSA_CLIENT_ID }}
      - name: Windows system DLL imports
        if: runner.os == 'Windows'
        shell: bash
        run: python tools/check_imports.py launcher/target/release/horizon-launcher.exe
      - name: Windows setup smoke (install identity)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          setup="$RUNNER_TEMP/setup-smoke"
          cp launcher/target/release/horizon-launcher.exe "$RUNNER_TEMP/horizon-launcher-setup.exe"
          "$RUNNER_TEMP/horizon-launcher-setup.exe" setup --quiet --dir "$setup"
          installed="$setup/GoatTech Launcher/horizon-launcher.exe"
          [[ -f "$installed" ]] || { echo "::error::the setup copied no launcher"; exit 1; }
          "$installed" uninstall --quiet
          [[ ! -f "$installed" ]] || { echo "::error::uninstall left the launcher"; exit 1; }
          rm -rf "$setup"
      - name: Make explicit portable package
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate binary-input
          # cargo hard-links target/release/<bin> to its deps/ copy; the packager refuses
          # multi-link inputs, so package a fresh single-link copy.
          cp launcher/target/release/${{ matrix.binary }} binary-input/${{ matrix.binary }}
          cargo metadata --manifest-path launcher/Cargo.toml --locked --offline --filter-platform ${{ matrix.target }} --format-version 1 > dependency-metadata.json
          python tools/package_goattech.py --binary binary-input/${{ matrix.binary }} --output candidate --platform ${{ matrix.platform }} --version "$HORIZON_LAUNCHER_VERSION" --source-commit "$GITHUB_SHA" --dependency-metadata dependency-metadata.json --dependency-root "$GITHUB_WORKSPACE" --dependency-root "$HOME/.cargo/registry/src"
          cat candidate/SHA256SUMS
      - name: Independently verify Windows archive and notice inventory
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_candidate.py --archive "candidate/goattech-launcher-$HORIZON_LAUNCHER_VERSION-windows-x64.zip" --source "$GITHUB_SHA" --metadata dependency-metadata.json
      - name: Qualify extracted Windows package without auth
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 6
        run: |
          ./tools/qa/windows-package-qualification.ps1 -Candidate "$PWD/candidate" -Out "$env:RUNNER_TEMP/package-evidence"
      - name: Export synthetic package evidence to log, never package artifacts
        if: always() && runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'package-evidence'
          $receipt=Join-Path $dir 'package-receipt.json'
          if (Test-Path $receipt) {Get-Content -LiteralPath $receipt}
          else {Write-Output 'PACKAGE-RECEIPT-MISSING'}
          foreach ($name in @('portable.png','installed.png')) {
            $path=Join-Path $dir $name
            if (-not (Test-Path $path)) {Write-Output "FRAME-MISSING $name";continue}
            if ((Get-Item -LiteralPath $path).Length -gt 1500000) {throw 'Frame exceeds export bound'}
            $sha=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            Write-Output "###FRAME-BEGIN $name sha256=$sha"
            $b64=[Convert]::ToBase64String([IO.File]::ReadAllBytes($path))
            for ($i=0;$i -lt $b64.Length;$i+=76) {Write-Output $b64.Substring($i,[Math]::Min(76,$b64.Length-$i))}
            Write-Output "###FRAME-END $name"
          }
      # Off by default. This repository is public, so anyone signed in to GitHub can download a
      # workflow artifact: turning it on distributes a build and needs the audience admitted first.
      # A candidate, not a release; publishing is a separate, approved step.
      - name: Keep the candidate for review
        if: ${{ inputs.keep_artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goattech-launcher-candidate-${{ matrix.platform }}
          path: |
            candidate/*
          retention-days: 7
          if-no-files-found: error
