name: qual suite 5eec97481
# One-off qualification: the launcher's full test suite (library and binary targets) on one
# standard GitHub-hosted Linux runner. Logs only: no artifacts, no cache, no secrets, nothing
# published. Runs only on a push to the one branch named below; no schedule, no dispatch,
# no pull_request. The qual branch is the candidate head below plus this one workflow-only
# commit, pushed exactly once. This file's own name on the qual branch is
# .github/workflows/qual-import-icon-notes-5eec97481.yml - the name the checkout assertion
# below binds.
on:
  push:
    branches: [qual-import-icon-notes-5eec97481]

permissions:
  contents: read

env:
  HORIZON_TELEMETRY_URL: "off"
  CARGO_TERM_COLOR: never

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Record and verify the exact checkout
        shell: bash
        run: |
          git rev-parse HEAD
          git log -1 --format='commit %H parents %P subject %s'
          git status --porcelain=v1 | tee /tmp/status.txt
          test ! -s /tmp/status.txt
          # The qual branch's one workflow-only commit sits exactly on the candidate,
          test "$(git rev-parse HEAD^)" = "5eec9748117042f3cda27cc6c51ec1ae9c888593"
          # and changes exactly this workflow file - no production file moves in it.
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/qual-import-icon-notes-5eec97481.yml"
      - name: Linux libraries GPUI links to
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev patchelf
      - name: Full launcher test suite
        working-directory: launcher
        run: cargo test --locked 2>&1 | tee /tmp/suite.log; test "${PIPESTATUS[0]}" -eq 0
        shell: bash
      - name: Result lines
        if: always()
        run: grep -E "^test result|Running |FAILED|panicked" /tmp/suite.log || true
