name: launcher-runtime-shot
# On-demand (a change to this file or to the diagnostic inputs it qualifies, on the
# integration branch), Linux-only,
# GitHub-hosted runtime capture and saved-state qualification: builds the launcher fresh from
# the checked-out source (no artifact reuse), runs it under a headless cage/wlroots compositor,
# captures the opening wordmark in a dense burst (the H evidence), captures the first-run
# consent dialog, scrolls it and answers "Keep optional data off" through the GUI itself via
# the compositor's wlr virtual pointer (tools/virtual_input.c), then checks the saved consent
# answer, the ping_notice_seen side effect and a saved setting across relaunches. Endpoint
# variants are qualified through the CLI (default/set/off; status_json reads config only,
# no telemetry traffic). The launcher still makes its ordinary PUBLIC fetches in every
# phase (version lists and similar); with the endpoint off and nothing consented it
# transmits no telemetry, and no telemetry endpoint is contacted. 960x600 is an OUTPUT-mode
# observation at the app's documented window_min_size (launcher/src/main.rs); it is NOT a
# window-resize or constraint-enforcement proof. 800x500 is a below-minimum adaptation
# observation. No accounts, no game/server launch, no purchases. The artifact is review
# evidence only: not a >9 review, not a release. Rendering is configured for software
# (headless wlroots + lavapipe ICD); the renderer the compositor and client actually select
# is NOT verified by this run: no GPU, performance or animation-smoothness claims. The GUI
# click and scroll use fixed coordinates for the 1280x720 default mode; layout drift fails
# the run loudly instead of passing silently. A virtual-input exit 0 only proves the
# compositor accepted the events; scroll proof is the frame pair showing body movement
# behind the fixed footer (frames inspected), and the click's proof is the saved consent
# and ping_notice_seen asserts below.

on:
  workflow_dispatch:
  push:
    # Fires when this workflow or a diagnostic input it qualifies changes on the
    # integration branch: the virtual-input helper and its protocol, and the opening
    # wordmark font with its bake/test tooling. Nothing wider: launcher source and
    # game changes go through their own CI.
    branches: [integrate-nov2-batch-20261103]
    paths:
      - '.github/workflows/launcher-runtime-shot.yml'
      - 'tools/virtual_input.c'
      - 'tools/wlr-virtual-pointer-unstable-v1.xml'
      - 'tools/bake_opening_font.py'
      - 'tools/test_opening_font.py'
      - 'launcher/assets/fonts/**'

permissions:
  contents: read

concurrency:
  group: launcher-runtime-shot-${{ github.ref }}
  cancel-in-progress: true

env:
  HORIZON_TELEMETRY_URL: "off"
  HORIZON_LAUNCHER_NO_SELF_UPDATE: "1"

jobs:
  capture:
    name: headless wayland runtime capture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: GPUI and compositor libraries (mirrors launcher.yml apt list + capture tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev cage grim wlr-randr mesa-vulkan-drivers vulkan-tools libwayland-bin
      - name: Build launcher
        working-directory: launcher
        run: cargo build --release --locked
      - name: Build virtual input client
        run: |
          wayland-scanner client-header tools/wlr-virtual-pointer-unstable-v1.xml "$RUNNER_TEMP/vp.h"
          wayland-scanner private-code tools/wlr-virtual-pointer-unstable-v1.xml "$RUNNER_TEMP/vp.c"
          gcc -O2 -Wall -o "$RUNNER_TEMP/virtual-input" tools/virtual_input.c "$RUNNER_TEMP/vp.c" -I"$RUNNER_TEMP" $(pkg-config --cflags --libs wayland-client)
      - name: Run, capture and qualify saved state
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
          XDG_PICTURES_DIR: ${{ runner.temp }}/captures
          WLR_BACKENDS: headless
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          HORIZON_LAUNCHER_HOME: ${{ runner.temp }}/launcher-home
          HORIZON_HOME: ${{ runner.temp }}/game-home
          HOME: ${{ runner.temp }}/shot-home
        run: |
          set -euo pipefail
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_PICTURES_DIR" "$HOME" && chmod 700 "$XDG_RUNTIME_DIR"
          BIN="$GITHUB_WORKSPACE/launcher/target/release/horizon-launcher"
          VINPUT="$RUNNER_TEMP/virtual-input"
          start_cage() {
            setsid cage -- "$BIN" >"$RUNNER_TEMP/cage-$1.log" 2>&1 &
            cage_pid=$!
          }
          find_sock() {
            sock=""
            for i in $(seq 1 30); do
              for cand in "$XDG_RUNTIME_DIR"/wayland-*; do
                [ -S "$cand" ] && { sock=$(basename "$cand"); break; }
              done
              [ -n "$sock" ] && break
              sleep 1
            done
            [ -n "$sock" ] || { echo "FAIL: compositor socket never appeared ($1)"; exit 1; }
            echo "compositor socket ($1): $sock"
          }
          stop_cage() {
            kill -TERM -- -"$cage_pid" 2>/dev/null || kill "$cage_pid" 2>/dev/null || true
            for i in 1 2 3 4 5; do kill -0 "$cage_pid" 2>/dev/null || break; sleep 1; done
            kill -KILL -- -"$cage_pid" 2>/dev/null || true
          }
          live() { kill -0 "$cage_pid" 2>/dev/null || { echo "FAIL: launcher died ($1)"; exit 1; }; }
          cap() {
            WAYLAND_DISPLAY="$sock" timeout 20 grim "$XDG_PICTURES_DIR/$1" || { echo "FAIL: grim $1"; exit 1; }
            [ -s "$XDG_PICTURES_DIR/$1" ] || { echo "FAIL: empty frame $1"; exit 1; }
          }
          output_extent() {
            WAYLAND_DISPLAY="$sock" timeout 20 wlr-randr 2>/dev/null \
              | grep -oE '[0-9]+x[0-9]+ px \(current\)' | head -1 | grep -oE '[0-9]+x[0-9]+' || true
          }
          cleanup() {
            stop_cage
            cp "$RUNNER_TEMP"/cage-*.log "$XDG_PICTURES_DIR/" 2>/dev/null || true
          }
          trap cleanup EXIT
          CONSENT="$HORIZON_HOME/telemetry/consent.json"
          SETTINGS="$HORIZON_LAUNCHER_HOME/settings.json"
          # Phase 1, default state: opening wordmark first (it ends before consent can show,
          # collection.rs asking_consent), then the first-run consent dialog. The wordmark's
          # visible window is short (hold 1.4s, max 2.5s, from the first rendered frame), so
          # capture a dense burst; timestamps recorded per frame.
          start_cage first
          find_sock first
          sleep 1; live intro-1; cap frame-intro-1.png
          echo "# frame,captured_at_unix" > "$XDG_PICTURES_DIR/intro-timestamps.txt"
          for i in $(seq -w 1 18); do
            sleep 0.35
            live "seq-$i"
            cap "frame-intro-seq-$i.png"
            echo "frame-intro-seq-$i.png,$(date +%s.%N)" >> "$XDG_PICTURES_DIR/intro-timestamps.txt"
          done
          sleep 4; live intro-4; cap frame-intro-4.png
          sleep 8; live dialog;  cap frame-dialog.png
          timeout 60 "$BIN" data status > "$XDG_PICTURES_DIR/data-status-default.txt" 2>&1 \
            || echo "note: data status (default) nonzero" >> "$RUNNER_TEMP/cage-first.log"
          [ ! -e "$CONSENT" ] || { echo "FAIL: consent.json exists before any answer"; exit 1; }
          # Scroll the dialog body through the compositor's virtual pointer and back. The
          # client's exit 0 only proves the compositor accepted the events; the proof of
          # actual scrolling is the frame pair (body moved behind the fixed footer),
          # inspected from the artifact.
          EXT=$(output_extent); EX=${EXT%x*}; EY=${EXT#*x}
          [ "$EX" = "1280" ] && [ "$EY" = "720" ] || { echo "FAIL: unexpected mode '$EXT' for coordinate input"; exit 1; }
          WAYLAND_DISPLAY="$sock" timeout 20 "$VINPUT" scroll $((EX/2)) $((EY/2)) "$EX" "$EY" 3 \
            || { echo "FAIL: virtual scroll down (client error)"; exit 1; }
          sleep 1; live dialog-scrolled; cap frame-dialog-scrolled.png
          WAYLAND_DISPLAY="$sock" timeout 20 "$VINPUT" scroll $((EX/2)) $((EY/2)) "$EX" "$EY" -3 \
            || { echo "FAIL: virtual scroll up (client error)"; exit 1; }
          sleep 1; live dialog-rescrolled; cap frame-dialog-rescrolled.png
          # Click "Keep optional data off" through the GUI itself: the dialog's own button
          # path (collection.rs answer_consent), at its 1280x720 layout position. The asserts
          # below fail loudly if the layout moved the button. The asserts do not by themselves
          # distinguish this button from "Save choices" with all switches off; the coordinate
          # plus the before/after frames carry that evidence.
          WAYLAND_DISPLAY="$sock" timeout 20 "$VINPUT" click 715 649 "$EX" "$EY" \
            || { echo "FAIL: virtual click (client error)"; exit 1; }
          sleep 2; live after-click; cap frame-after-click.png
          [ -f "$CONSENT" ] || { echo "FAIL: consent.json missing after GUI answer"; exit 1; }
          jq -e '.version == 3 and (.answered | tonumber) > 0
            and .choices.performance == false and .choices.crashes == false
            and .choices.bugs == false and .choices.benchmarks == false
            and ((.install_id // "") == "")' "$CONSENT" > /dev/null \
            || { echo "FAIL: consent.json content wrong after GUI answer:"; cat "$CONSENT"; exit 1; }
          cp "$CONSENT" "$XDG_PICTURES_DIR/consent-after-gui-deny.json"
          jq -e '.ping_notice_seen == true' "$SETTINGS" > /dev/null \
            || { echo "FAIL: GUI answer did not set ping_notice_seen:"; cat "$SETTINGS"; exit 1; }
          stop_cage
          # Endpoint variants through the CLI: one binary, three configurations, no network
          # (status_json reads config only). The endpoint and the ping copy must follow the
          # configuration (telemetry.rs status_json).
          env -u HORIZON_TELEMETRY_URL timeout 60 "$BIN" --json data status > "$XDG_PICTURES_DIR/data-status-endpoint-default.json" 2>&1 \
            || { echo "FAIL: data status (endpoint default)"; exit 1; }
          jq -e '.server == null and (.ping | contains("telemetry.goattech.us"))' "$XDG_PICTURES_DIR/data-status-endpoint-default.json" > /dev/null \
            || { echo "FAIL: endpoint-default status wrong:"; cat "$XDG_PICTURES_DIR/data-status-endpoint-default.json"; exit 1; }
          HORIZON_TELEMETRY_URL="http://127.0.0.1:9" timeout 60 "$BIN" --json data status > "$XDG_PICTURES_DIR/data-status-endpoint-set.json" 2>&1 \
            || { echo "FAIL: data status (endpoint set)"; exit 1; }
          jq -e '.server == "http://127.0.0.1:9" and (.ping | length) > 0' "$XDG_PICTURES_DIR/data-status-endpoint-set.json" > /dev/null \
            || { echo "FAIL: endpoint-set status wrong:"; cat "$XDG_PICTURES_DIR/data-status-endpoint-set.json"; exit 1; }
          HORIZON_TELEMETRY_URL="off" timeout 60 "$BIN" --json data status > "$XDG_PICTURES_DIR/data-status-endpoint-off.json" 2>&1 \
            || { echo "FAIL: data status (endpoint off)"; exit 1; }
          jq -e '.server == null and (.ping | contains("is off in this configuration"))' "$XDG_PICTURES_DIR/data-status-endpoint-off.json" > /dev/null \
            || { echo "FAIL: endpoint-off status wrong:"; cat "$XDG_PICTURES_DIR/data-status-endpoint-off.json"; exit 1; }
          # Phase 2: answer "everything optional off" through the launcher's own CLI as well
          # (the same answer() writer the dialog button calls; CLI path regression).
          timeout 60 "$BIN" data deny all > "$XDG_PICTURES_DIR/data-deny-all.txt" 2>&1 \
            || { echo "FAIL: data deny all"; exit 1; }
          jq -e '.version == 3 and (.answered | tonumber) > 0
            and .choices.performance == false and .choices.crashes == false
            and .choices.bugs == false and .choices.benchmarks == false
            and ((.install_id // "") == "")' "$CONSENT" > /dev/null \
            || { echo "FAIL: consent.json content wrong:"; cat "$CONSENT"; exit 1; }
          cp "$CONSENT" "$XDG_PICTURES_DIR/consent-after-deny.json"
          timeout 60 "$BIN" --json data status > "$XDG_PICTURES_DIR/data-status-after-deny.json" 2>&1 \
            || echo "note: data status (after deny) nonzero" >> "$RUNNER_TEMP/cage-first.log"
          # Phase 3, relaunch same homes: the dialog must not return and the saved answer must
          # be untouched (frame inspected; file compared byte for byte).
          start_cage relaunch
          find_sock relaunch
          sleep 1; live relaunch-intro; cap frame-relaunch-intro.png
          sleep 12; live relaunch; cap frame-relaunch.png
          cmp -s "$CONSENT" "$XDG_PICTURES_DIR/consent-after-deny.json" \
            || { echo "FAIL: relaunch rewrote consent.json"; exit 1; }
          cp "$CONSENT" "$XDG_PICTURES_DIR/consent-after-relaunch.json"
          stop_cage
          # Phase 4, settings truthfulness: turn the opening animation off through the CLI,
          # then a relaunch must start on Home, not the wordmark (frames inspected).
          timeout 60 "$BIN" settings opening-animation off > "$XDG_PICTURES_DIR/settings-set-opening-off.txt" 2>&1 \
            || { echo "FAIL: settings opening-animation off"; exit 1; }
          jq -e '.skip_opening == true' "$SETTINGS" > /dev/null \
            || { echo "FAIL: settings.json skip_opening not true:"; cat "$SETTINGS"; exit 1; }
          timeout 60 "$BIN" settings > "$XDG_PICTURES_DIR/settings-after-set.txt" 2>&1 \
            || echo "note: settings list nonzero" >> "$RUNNER_TEMP/cage-relaunch.log"
          start_cage settings
          find_sock settings
          sleep 2; live settings-early; cap frame-settings-off-early.png
          sleep 10; live settings-settled; cap frame-settings-off-settled.png
          stop_cage
          # Phase 5, output-mode observation at the app's documented minimum: the source
          # declares window_min_size 960x600 (launcher/src/main.rs WindowOptions); set the
          # compositor OUTPUT to that mode with a fresh home and capture the first-run
          # dialog. This does NOT prove client-side resize behavior or constraint
          # enforcement; the recorded mode is the evidence of what was observed.
          export HORIZON_HOME="$RUNNER_TEMP/game-home-min"
          {
            echo "960x600 phase: compositor output set to the app's documented"
            echo "window_min_size (launcher/src/main.rs WindowOptions). This is an"
            echo "output-mode observation of the rendered dialog at that size, not a"
            echo "window-resize or constraint-enforcement proof."
          } > "$XDG_PICTURES_DIR/min-window-notes.txt"
          start_cage min
          find_sock min
          sleep 3
          WAYLAND_DISPLAY="$sock" timeout 20 wlr-randr --output HEADLESS-1 --custom-mode 960x600 >>"$RUNNER_TEMP/cage-min.log" 2>&1 \
            || WAYLAND_DISPLAY="$sock" timeout 20 wlr-randr --output HEADLESS-1 --mode 960x600 >>"$RUNNER_TEMP/cage-min.log" 2>&1 \
            || { echo "FAIL: 960x600 mode-set"; exit 1; }
          WAYLAND_DISPLAY="$sock" timeout 20 wlr-randr > "$XDG_PICTURES_DIR/wlr-randr-min.txt" 2>&1 || true
          sleep 12; live dialog-min; cap frame-dialog-min.png
          stop_cage
          # Phase 6, below-minimum adaptation observation (800x500 < the 960x600 documented
          # minimum): footer separation under overflow, not a minimum-window test.
          export HORIZON_HOME="$RUNNER_TEMP/game-home-small"
          start_cage small
          find_sock small
          sleep 3
          WAYLAND_DISPLAY="$sock" timeout 20 wlr-randr --output HEADLESS-1 --custom-mode 800x500 >>"$RUNNER_TEMP/cage-small.log" 2>&1 \
            || WAYLAND_DISPLAY="$sock" timeout 20 wlr-randr --output HEADLESS-1 --mode 800x500 >>"$RUNNER_TEMP/cage-small.log" 2>&1 \
            || echo "note: 800x500 mode-set failed; small-output dialog captured at the default mode" >> "$RUNNER_TEMP/cage-small.log"
          WAYLAND_DISPLAY="$sock" timeout 20 wlr-randr > "$XDG_PICTURES_DIR/wlr-randr-small.txt" 2>&1 || true
          sleep 10; live dialog-small; cap frame-dialog-small.png
          stop_cage
          echo "capture and qualification sequence complete"
          ls -la "$XDG_PICTURES_DIR"
      - name: Evidence manifest
        if: always()
        run: |
          mkdir -p "${{ runner.temp }}/captures"
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "github_sha=${{ github.sha }}"
            echo "workflow_sha=${{ github.workflow_sha }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            [ -f launcher/target/release/horizon-launcher ] && echo "binary_sha256=$(sha256sum launcher/target/release/horizon-launcher | awk '{print $1}')"
            echo "virtual_input_c_sha256=$(sha256sum tools/virtual_input.c | awk '{print $1}')"
            echo "virtual_pointer_xml_sha256=$(sha256sum tools/wlr-virtual-pointer-unstable-v1.xml | awk '{print $1}')"
            [ -f "${{ runner.temp }}/virtual-input" ] && echo "virtual_input_bin_sha256=$(sha256sum "${{ runner.temp }}/virtual-input" | awk '{print $1}')"
            rustc --version
            cargo --version
            gcc --version | head -1
            wayland-scanner --version 2>&1 | head -1
            dpkg -l cage grim wlr-randr mesa-vulkan-drivers 2>/dev/null | grep '^ii' || true
            vulkaninfo --summary 2>/dev/null | grep -i -m2 "deviceName\|driverName" || true
          } | tee "${{ runner.temp }}/captures/manifest.txt"
      - name: Upload frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launcher-runtime-shot
          path: ${{ runner.temp }}/captures/
          retention-days: 5
          if-no-files-found: error
